openapi: 3.0.1
info:
  title: CIS
  version: "1.0"
  description: API for retrieving user profiles.
servers:
  - url: https://example.com
paths:
  /Users:
    get:
      summary: Retrieve users list
      operationId: getUsers
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    userName:
                      type: string
