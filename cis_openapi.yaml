        '201':
          description: Custom schema is created successfully.
          content:
            application/scim+json:
              schema: {$ref: '#/components/schemas/Schema'}
              example:
                id: urn:sap:cloud:scim:schemas:extension:custom:2.0:CustomSchema
                schemas: ['urn:ietf:params:scim:schemas:core:2.0:Schema']
                name: CustomSchema
                description: Custom schema description
                attributes:
                - {name: customAttribute, type: string, multiValued: false, description: Custom attribute description, required: false, caseExact: false, mutability: readWrite, returned: default, uniqueness: none}
        '400':
          description: |
