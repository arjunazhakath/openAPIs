              example:
                status: 400
                schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
                detail: Invalid fields.
        '404':
          description: The group with the provided ID does not exist.
          content:
            application/scim+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                status: 404
                schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
                detail: Group  <user_id> not found!
        '500': {$ref: '#/components/responses/500'}
        '401': {$ref: '#/components/responses/401'}
        '429': {$ref: '#/components/responses/429'}
        '403': {$ref: '#/components/responses/403'}
        '409': {$ref: '#/components/responses/409'}
    delete:
      tags: [Groups]
      summary: Deletes a specific group.
      description: Deletes a group by id and revoke all its member assignments. <br><br> `Authorization Policy Groups Limitations:` Authorization Policy groups cannot be created or deleted. They can be only edited by **adding/removing members**, changing **displayName** and **description**.
      operationId: deleteGroup
