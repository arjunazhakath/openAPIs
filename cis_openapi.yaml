  /Bulk:
    post:
      tags: [Bulk]
      summary: Create, modify and delete user and group resources in bulk
      description: |-
        Executes multiple create, update and delete operations for users and groups in single request.
        ## Limitations:
          - `failsOnErrors` attribute is not supported.
          - Maximum number of bulk operation per request is `100`
          - Cross-references of new resources in and across operations is not allowed.
            Each bulk operation should be independent
      operationId: bulk
      requestBody:
        content:
          application/scim+json:
            schema:
              type: object
              title: BulkRequest
              required: [schemas, Operations]
              properties:
                schemas:
                  type: array
                  default: ['urn:ietf:params:scim:api:messages:2.0:BulkRequest']
                  description: The body of each request MUST contain the "schemas" attribute with the URI value of "urn:ietf:params:scim:api:messages:2.0:BulkRequest"
                  items: {type: string}
                Operations:
                  type: array
                  description: Sequence of operations that create, modify or delete resource
                  items:
                    type: object
                    title: BulkRequestOperation
                    required: [method, path]
                    properties:
                      method: {type: string, description: The HTTP method of the current operation.}
                      bulkId: {type: string, description: 'The transient identifier of a newly created resource, unique within a bulk request and created by the client.  The bulkId serves as a surrogate resource id enabling clients to uniquely identify newly created resources in the response.'}
                      path: {type: string, description: 'The resource''s relative path to the SCIM root If "method" is `POST`, the value must specify a resource type endpoint, e.g., **/Users** or **/Groups**, whereas all other `method` values must specify the path to a specific resource, e.g., **/Users/2819c223-7f76-453a-919d-413861904646**.'}
                      data: {$ref: '#/components/schemas/AnyObject'}
            examples:
              createMultipleUsers: {$ref: '#/components/examples/BulkCreateMultipleUsers'}
              bulkIndependentOperations: {$ref: '#/components/examples/BulkIndependentOperations'}
              updateMultipleUsersAttributes: {$ref: '#/components/examples/BulkUpdateMultipleUsersAttributes'}
              updateUserSingleAttribute: {$ref: '#/components/examples/UpdateUserSingleAttribute'}
              createMultipleGroups: {$ref: '#/components/examples/CreateMultipleGroups'}
              createAndUpdateMultipleGroups: {$ref: '#/components/examples/CreateAndUpdateMultipleGroups'}
              patchGroupAttribute: {$ref: '#/components/examples/PatchGroupAttribute'}
      responses:
        '200':
          description: The bulk request was executed successfully.
          content:
            application/scim+json:
              schema:
                type: object
                title: BulkResponse
                required: [schemas, Operations]
                properties:
                  schemas:
                    type: array
                    description: The body of each request MUST contain the "schemas" attribute with the URI value of "urn:ietf:params:scim:api:messages:2.0:BulkResponse"
                    items: {type: string}
                    default: ['urn:ietf:params:scim:api:messages:2.0:BulkResponse']
                  Operations:
                    type: array
                    description: Sequence of operations that create, modify or delete resource
                    items:
                      type: object
                      title: BulkResponseOperation
                      additionalProperties: true
                      properties:
                        method: {type: string, description: The HTTP method of the current operation.}
                        bulkId: {type: string, description: The id of the processed bulk operation}
                        location: {type: string, description: The resource endpoint URL. REQUIRED except in the event of a `POST` failure.}
                        version: {type: string, description: the version of the resource}
                        status: {type: string, description: The HTTP status code of the operation., example: '201'}
                        response: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                createMultipleUsers: {$ref: '#/components/examples/BulkCreateMultipleUsersResponse'}
                independentOperations: {$ref: '#/components/examples/BulkIndependentOperationsResponse'}
                updateMultipleUsersAttributes: {$ref: '#/components/examples/UpdateMultipleUsersAttributesResponse'}
                updateUserSingleAttribute: {$ref: '#/components/examples/UpdateUserSingleAttributeResponse'}
                createMultipleGroups: {$ref: '#/components/examples/CreateMultipleGroupsResponse'}
                createAndUpdateMultipleGroups: {$ref: '#/components/examples/CreateAndUpdateMultipleGroupsResponse'}
                patchGroupAttribute: {$ref: '#/components/examples/PatchGroupAttributeResponse'}
        '413':
          description: Maximum operations count exceeded
          content:
            application/scim+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                Max operations exceeded:
                  summary: Maximum operations count exceeded
                  value:
                    status: '413'
                    scimType: tooMany
                    schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
                    detail: Bulk operations count exceeded the maximum value supported.
        '400':
          description: The bulk request body format is invalid
          content:
            application/scim+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                Invalid path:
                  summary: Invalid bulk operation path
                  value:
                  - status: '400'
                    schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
                    detail: 'Invalid operation with bulkId: 4ecf320f-7bfe-4f8b-91dc-f8f52322d713. Reason: Invalid path endpoint for operation with bulkId: 4ecf320f-7bfe-4f8b-91dc-f8f52322d713. Path should start with either Users or Groups endpoint.'
                Cross-references unsupported:
                  summary: Cross-references are not allowed
                  value:
                    status: '400'
                    scimType: invalidValue
                    schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
                    detail: Bulk references across operations are not allowed.
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '429': {$ref: '#/components/responses/429'}
  /ServiceProviderConfig:
    get:
      tags: [Service Provider Config]
      operationId: getServiceProviderConfig
      summary: Retrieves service provider configuration.
      description: Includes the SCIM specification features supported by the IdDS SCIM API.
      responses:
        '200':
          description: The request was executed successfully.
          content:
            application/scim+json:
              schema:
                type: object
                title: ServiceProviderConfig
                properties:
                  meta: {$ref: '#/components/schemas/Meta'}
                  schemas:
                    type: array
                    items: {type: string}
                    default: ['urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig']
                  paging:
                    type: object
                    title: PagingConfig
                    properties:
                      supported: {type: boolean}
                      defaultStartIndex: {type: integer}
                      defaultCount: {type: integer}
                      startIdPagingParam: {type: string}
                      nextIdPagingParam: {type: string}
                  pagination:
                    type: object
                    title: PaginationConfig
                    properties:
                      index: {type: boolean}
                      cursor: {type: boolean}
                      defaultPageSize: {type: integer}
                      maximumPageSize: {type: integer}
                  patch:
                    type: object
                    title: Supported
                    properties:
                      supported: {type: boolean}
                  changePassword:
                    type: object
                    title: Supported
                    properties:
                      supported: {type: boolean}
                  sort:
                    type: object
                    title: Supported
                    properties:
                      supported: {type: boolean}
                  etag:
                    type: object
                    title: Supported
                    properties:
                      supported: {type: boolean}
                  filter:
                    type: object
                    title: FilterConfig
                    properties:
                      supported: {type: boolean}
                      maxResults: {type: integer}
                  bulk:
                    type: object
                    title: BulkConfig
                    properties:
                      supported: {type: boolean}
                      maxOperations: {type: integer}
                      maxPayloadSize: {type: integer}
                  authenticationSchemes:
                    type: array
                    items:
                      type: object
                      title: AuthenticationSchema
                      properties:
                        type: {type: string}
                        name: {type: string}
                        description: {type: string}
                        specUri: {type: string}
              examples:
                getServiceProviderConfig: {$ref: '#/components/examples/ServiceProviderConfigResponse'}
        '401': {$ref: '#/components/responses/401'}
        '429': {$ref: '#/components/responses/429'}
  /ResourceTypes:
    get:
      tags: [Resource Types]
      operationId: getResourceTypes
      summary: Retrieves all resource types (User, Group and Schema).
      description: Retrieves all types of resources supported by the API. Each resource type defines the endpoints, the core schema URI that defines the resource, and any supported schema extensions.
      responses:
        '200':
          description: The request was executed successfully.
          content:
            application/scim+json:
              schema:
                type: object
                title: SearchResultResourceTypes
                allOf:
                - {$ref: '#/components/schemas/SearchResult'}
                - type: object
                  properties:
                    Resources:
                      type: array
                      items: {$ref: '#/components/schemas/ResourceType'}
              examples:
                getResourceTypes: {$ref: '#/components/examples/ResourceTypeResponse'}
        '401': {$ref: '#/components/responses/401'}
        '429': {$ref: '#/components/responses/429'}
  /ResourceTypes/{ResourceType}:
    get:
      tags: [Resource Types]
      operationId: getResourceType
      summary: Retrieves a specific resource type. (User, Group or Schema)
      parameters:
      - name: ResourceType
        in: path
        required: true
        description: The type of resource to be retrieved.
        schema: {type: string}
      description: Retrieves a specific resource type.
      responses:
        '200':
          description: The request was executed successfully.
          content:
            application/scim+json:
              schema: {$ref: '#/components/schemas/ResourceType'}
              examples:
                getUserResourceTypes: {$ref: '#/components/examples/UserResourceTypeResponse'}
                getGroupResourceTypes: {$ref: '#/components/examples/GroupResourceTypeResponse'}
                getSchemaResourceTypes: {$ref: '#/components/examples/SchemaResourceTypeResponse'}
        '401': {$ref: '#/components/responses/401'}
        '404':
          description: Provided ResourceType does not exist.
          content:
            application/scim+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                status: 404
                schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
                detail: ResourceType <resource_type> not found
        '429': {$ref: '#/components/responses/429'}
components:
  schemas:
    User:
      type: object
      description: The User resource represents a user in the system. It contains attributes such as userName, password, name, emails, phoneNumbers, and other personal information.
      required: [schemas]
      properties:
        id: {type: string, description: Unique resource ID}
        externalId: {type: string, description: External resource ID defined by provisioning client, maxLength: 64}
        meta: {$ref: '#/components/schemas/Meta'}
        schemas:
          type: array
          default: ['urn:ietf:params:scim:schemas:core:2.0:User']
          description: 'A list of one or more URIs which are used to indicate the SCIM schemas that define the allowed attributes for a resource. Must contain the core schema URI for User resource: `urn:ietf:params:scim:schemas:core:2.0:User`.'
          items: {type: string}
        userName: {type: string, maxLength: 256, description: 'The userName attribute is the unique identifier for the user in the system. It must be unique across all users. The following characters: <, >, : are not allowed.', x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.ALWAYS)', default: ''}
        password: {type: string, description: 'This attribute is intended to be used as a means to set or replace a password.  Password must comply with the password policy requirements, e.g.  length, history and required character groups. The mutability of the  attribute is "writeOnly", indicating that it is never returned  in any form (the attribute characteristic "returned" is "never").'}
        name:
          type: object
          title: Name
          properties:
            familyName: {type: string, maxLength: 128, description: 'The following characters: <, >, : are not allowed.'}
            givenName: {type: string, maxLength: 128, description: 'The following characters: <, >, : are not allowed.'}
            formatted: {type: string, maxLength: 128}
            middleName: {type: string, maxLength: 128}
            honorificPrefix: {type: string, maxLength: 16, description: HonorificPrefix is part of the Master Data attributes and have canonical values. The specific values for this attribute can be found on `<tenantUrl>/service/md/salutations`}
            honorificSuffix: {type: string, maxLength: 16}
        displayName: {type: string, maxLength: 512}
        nickName: {type: string, maxLength: 64}
        profileUrl: {type: string, maxLength: 128}
        title: {type: string, maxLength: 72}
        userType: {type: string, maxLength: 36, description: 'Specifies the type of the user. The allowed values are "public",  "partner", "customer", "external", "onboardee", "employee" or "alumni". The default type is "public".'}
        preferredLanguage: {type: string, maxLength: 36}
        locale: {type: string, maxLength: 16, description: Locale is part of the Master Data attributes and have canonical values. The specific values for this attribute can be found on `<tenantUrl>/service/md/languages`}
        timezone: {type: string, description: Timezone is part of the Master Data attributes and have canonical values. The specific values for this attribute can be found on `<tenantUrl>/service/md/timezones`}
        active: {type: boolean, description: The default value for the attribute is false.}
        emails:
          type: array
          maxItems: 20
          items:
            type: object
            title: Email
            required: [value]
            properties:
              type: {type: string}
              value: {type: string, maxLength: 256, description: 'The emails.value subAttribute supports the following characters - uppercase and lowercase Latin letters, digits from 0 to 9, special characters !#$%&''*+-/=?^_`{|}~ Space and the (),:;<>@[] characters can be used only if surrounded by quotation marks.'}
              display: {type: string, maxLength: 128}
              primary: {type: boolean}
        phoneNumbers:
          type: array
          maxItems: 120
          items:
            type: object
            title: PhoneNumber
            required: [value]
            properties:
              type: {type: string}
              value: {type: string, maxLength: 64}
              display: {type: string, maxLength: 36}
              primary: {type: boolean}
        photos:
          type: array
          maxItems: 20
          items:
            type: object
            title: Photo
            required: [value]
            properties:
              type: {type: string}
              value: {type: string, maxLength: 128}
              display: {type: string, maxLength: 64}
              primary: {type: boolean}
        addresses:
          type: array
          maxItems: 20
          items:
            type: object
            title: Address
            properties:
              formatted: {type: string, maxLength: 128}
              primary: {type: boolean}
              country: {type: string, maxLength: 32, description: Country is part of the Master Data attributes and have canonical values. The specific values for this attribute can be found on `<tenantUrl>/service/md/countries`}
              locality: {type: string, maxLength: 512}
              postalCode: {type: string, maxLength: 64}
              region: {type: string, maxLength: 64}
              streetAddress: {type: string, maxLength: 512}
              type: {type: string}
        entitlements:
          type: array
          maxItems: 20
          items:
            type: object
            title: Entitlement
            required: [value]
            properties:
              type: {type: string, maxLength: 16}
              value: {type: string, maxLength: 64}
              display: {type: string, maxLength: 64}
              primary: {type: boolean}
        roles:
          type: array
          maxItems: 600
          items:
            type: object
            title: Role
            required: [value]
            properties:
              type: {type: string, maxLength: 36, example: 'Read Users, Manage Groups, Manage Users, Manage Access'}
              value: {type: string, maxLength: 128}
              display: {type: string, maxLength: 128}
              primary: {type: boolean}
        ims:
          type: array
          maxItems: 20
          items:
            type: object
            title: Im
            required: [value]
            properties:
              type: {type: string}
              value: {type: string, maxLength: 64}
              display: {type: string, maxLength: 64}
              primary: {type: boolean}
        x509Certificates:
          type: array
          maxItems: 20
          items:
            type: object
            title: X509Certificate
            required: [value]
            properties:
              type: {type: string, maxLength: 32}
              value: {type: string, maxLength: 5000}
              display: {type: string, maxLength: 64}
              primary: {type: boolean}
        groups:
          type: array
          items:
            type: object
            title: GroupRef
            properties:
              type: {type: string}
              value: {type: string}
              display: {type: string}
              $ref: {type: string}
      additionalProperties:
        type: object
        description: "SCIM extensions enable the API to support custom attributes and \nadditional schemas beyond the standard SCIM specification. \nThis allows organizations to extend users with application-specific or \norganization-specific data. Extensions are identified by unique URNs \nand should be used according to their documentation. \n\nPredefined extension schemas include: \n* urn:ietf:params:scim:schemas:extension:enterprise:2.0:User - see the \"UserExtensionEnterprise\" schema definition below.\n* urn:sap:cloud:scim:schemas:extension:custom:2.0:User - see the \"UserExtensionCustom\" schema definition below.\n* urn:ietf:params:scim:schemas:extension:sap.application:2.0:User - see the \"UserApplicationExtension\" schema definition below.\n* urn:ietf:params:scim:schemas:extension:sap:2.0:User - see the \"UserExtensionSap\" schema definition below.\n* urn:ietf:params:scim:schemas:extension:sap.odm:2.0:User - see the \"UserExtensionSapOdm\" schema definition below. \n* urn:ietf:params:scim:schemas:extension:sap.ariba:2.0:User - see the \"UserExtensionSapAriba\" schema definition below.\n"
        example:
          urn:ietf:params:scim:schemas:extension:enterprise:2.0:User: {department: Engineering, costCenter: CC12345}
    UserExtensionEnterprise:
      type: object
      description: SCIM extension defines attributes commonly used in representing users  that belong to, or act on behalf of, a business or enterprise. See [RFC 7643](https://datatracker.ietf.org/doc/html/rfc7643#section-4.3) for more details.
      properties:
        division: {type: string, maxLength: 256, description: Identifies the name of a division.}
        costCenter: {type: string, maxLength: 128, description: Identifies the name of a cost center.}
        organization: {type: string, maxLength: 128, description: Identifies the name of an organization.}
        department: {type: string, description: Identifies the name of a department. Department is part of the Master Data attributes and have canonical values. The specific values for this attribute can be found on `<tenantUrl>/service/md/departments`"}
        employeeNumber: {type: string, maxLength: 128, description: 'A string identifier, typically numeric or alphanumeric, assigned to a person, typically based on order of hire or association with an organization'}
        manager:
          type: object
          title: Manager
          description: A reference to the User resource that represents the user's manager. This is typically a reference to another User resource.
          properties:
            displayName: {type: string, maxLength: 128, description: The displayName of the user's manager}
            value: {type: string, maxLength: 36, description: The unique identifier of the manager. This is typically the User resource identifier of the manager.}
            $ref: {type: string, description: The URI of the SCIM resource representing the User's manager.}
    UserApplicationExtension:
      type: object
      description: Extension schema for application-specific user attributes. Contains the `applicationUsers` multi-value attribute, which holds the user's identity and custom data within each registered application. This extension is identified by the schema URI `urn:ietf:params:scim:schemas:extension:sap.application:2.0:User`.
      properties:
        applicationUsers:
          type: array
          description: Application-specific user records. Each entry represents the user's identity within a particular application. Returned only when explicitly requested via the `attributes` query parameter.
          items:
            type: object
            title: ApplicationUser
            required: [nameId, applicationId]
            properties:
              id: {type: string, readOnly: true, maxLength: 36, description: The unique identifier of the application user record.}
              applicationId: {type: string, maxLength: 36, description: The identifier of the application this user record belongs to. Immutable after creation. Supports filtering.}
              nameId: {type: string, maxLength: 256, description: The subject identifier of the user within the application. Must be unique across the server. Supports filtering.}
              status: {type: string, maxLength: 16, description: 'The status of the application user. The allowed values are "active", "inactive" and "new".'}
              activationTime: {type: string, format: date-time, readOnly: true, description: The timestamp when the application user was activated.}
              loginTime: {type: string, format: date-time, readOnly: true, description: The timestamp of the user's last login to the application.}
              organisationId: {type: string, maxLength: 36, description: The identifier of the organisation the application user belongs to.}
              customAttribute1: {type: string, maxLength: 2048, description: Custom attribute for extending application user information.}
              customAttribute2: {type: string, maxLength: 2048, description: Custom attribute for extending application user information.}
              customAttribute3: {type: string, maxLength: 2048, description: Custom attribute for extending application user information.}
              customAttribute4: {type: string, maxLength: 2048, description: Custom attribute for extending application user information.}
              customAttribute5: {type: string, maxLength: 2048, description: Custom attribute for extending application user information.}
    UserExtensionCustom:
      type: object
      properties:
        attributes:
          type: array
          maxItems: 10
          description: Custom attribute for extending user information.
          items:
            type: object
            title: CustomAttribute
            properties:
              name:
                type: string
                description: "The name of the custom attribute. Canonical values are: \n- customAttribute1\n- customAttribute2\n- customAttribute3\n- customAttribute4\n- customAttribute5\n- customAttribute6\n- customAttribute7\n- customAttribute8\n- customAttribute9\n- customAttribute10\n"
              value: {type: string, maxLength: 5000, description: The value of the custom attribute.}
    UserExtensionSap:
      type: object
      properties:
        loginTime: {type: string, format: date-time}
        sourceSystem: {type: integer, description: 'This attribute is used for the [Corporate User Store](https://help.sap.com/docs/identity-authentication/identity-authentication/corporate-user-store) and [Password Migration](https://help.sap.com/docs/identity-authentication/identity-authentication/external-source-systems) scenarios. The value for the Corporate User Store is 39.'}
        sourceSystemId: {type: string, maxLength: 64, description: 'Identifier of the application or system that will migrate passwords. SourceSystemId is used only for the [Password Migration](https://help.sap.com/docs/identity-authentication/identity-authentication/external-source-systems) scenarios.'}
        applicationId: {type: string, description: 'Specifies the id of the application from which the email template set is going to be chosen. It can be copied from the URL when the application is selected in the administration console. If applicationId is provided, the application context can be specified, so configurations of that application like Home URL, Email Template Set, Branding may be applied to the account activation flow. ApplicationId is not stored in the DB, it is only using for the runtime procces by the user.'}
        emailTemplateSetId: {type: string, description: 'Specifies the id of the email template set which is going to be used to create an activation mail message. It can be copied from the URL when the e-mail template set is selected in the administration console. EmailTemplateSetId is not stored in the DB, it is only using for the runtime procces by the user.'}
        sendMail: {type: boolean, description: 'Specifies if an activation mail should be sent. The value of the attribute only matters when creating the user. If the value of the attribute is not passed in the request body or is set to false and applicationId is provided, then an activationUrl will be returned in the response.'}
        targetUrl: {type: string, description: 'Specifies an application link to which an user will be redirected after account activation. TargetUrl is not stored in the DB, it is only using for the runtime procces by the user.'}
        activationUrl: {type: string, description: 'Specifies the link used for activating the account. It is returned when the user is created, only if ''sendMail'' attribute is missing or set to false and ''applicationId'' is provided.'}
        mailVerified: {type: boolean, description: 'The attribute specifies if the e-mail of the newly created user is verified or not. So if the values of the mailVerified and sendMail are true, this means that the user will receive e-mail and he or she will be able to log on. On the other hand, if the sendMail is true, but the mailVerified is false, the user will receive e-mail and he or she has to click the verification link in the e-mail. If the attribute "verified" is not passed in the request body, the default value of mailVerified is false.'}
        userUuid: {type: string, pattern: '^[-+_\/:.A-Za-z0-9]{1,36}$', example: 30ac69fe-5155-4d7f-8830-e9af6bf3e401}
        userUuidHistory:
          type: array
          items: {type: string}
          description: Every time when the userUuid value is changed the old value will be marked as historic and will appear in userUuidHistory attribute. This attribute is read only and it holds all historic userUuid values.
        userId: {type: string, description: 'Once the user is created, userId is automatically generated.'}
        sapUserName: {type: string, maxLength: 128, description: 'Attribute sapUserName should match pattern \"^(?!.*(i|d|s|c|p)([0-9]){5,9})[a-z0-9]+[a-z0-9\\._-]*$\"'}
        status: {type: string, description: 'Specifies if the user is created as active, inactive or new. If the attribute "active" is not passed in the request body, the default value of the attribute "status" is inactive.'}
        totpEnabled: {type: boolean, description: Specifies if time-based one-time password authentication is enabled.}
        webAuthEnabled: {type: boolean, description: Specifies if web authentication is enabled.}
        industry: {type: string, description: Industry is part of the Master Data attributes and have canonical values. The specific values for this attribute can be found on `<tenantUrl>/service/md/industries`}
        companyRelationship: {type: string, maxLength: 16, description: CompanyRelationship is part of the Master Data attributes and have canonical values. The specific values for this attribute can be found on `<tenantUrl>/service/md/relationships`}
        function: {type: string, description: Function is part of the Master Data attributes and have canonical values. The specific values for this attribute can be found on `<tenantUrl>/service/md/functions`}
        mfaEnabled: {type: boolean, description: Specifies if multi-factor authentication is enabled.}
        enforceMfa: {type: boolean, description: Specifies if multi-factor authentication is enforced.}
        contactPreferences:
          type: object
          title: ContactPreference
          properties:
            email:
              type: string
              maxLength: 256
              enum: ['yes', 'no', unknown]
            telephone:
              type: string
              maxLength: 64
              enum: ['yes', 'no', unknown]
          description: Specifies the contact preferences of the user.
        passwordHash:
          type: object
          title: PasswordHash
          properties:
            algorithm: {type: string, description: The algorithm used to hash the password. The only allowed value is SHA-256.}
            value: {type: string, description: The password hash value. It must be in HEX format.}
            salt: {type: string, description: The salt value must be in HEX format.}
            cycles: {type: integer, description: The number of iterations used in the hashing process.}
          description: This attribute is intended to be used as a means to set or replace a password hash. The mutability of the attribute is "writeOnly", indicating that it is never returned in any form. The main purpose of the attribute is to be used for migrating users from one user store to another.
        totpDetails:
          type: object
          title: TotpDetails
          properties:
            secret: {type: string, description: The value must be in HEX format.}
            failedLoginAttempts: {type: integer, description: The number of failed login attempts using TOTP. It is a readOnly attribute.}
            lockedTime: {type: string, format: date-time, description: The time when TOTP authentication was locked due to too many failed login attempts. It is a readOnly attribute.}
          description: This attribute is intended to be used as a means to set or replace Time-based one-time password (TOTP).
        language:
          type: object
          title: Language
          properties:
            preferred: {type: string, description: Preferred language. The format should follow RFC5646 language tag standard.}
            correspondence: {type: string, description: 'Language used for official communications, such as emails, letters, and documents. The format should follow RFC5646 language tag standard.'}
        localeSettings:
          type: object
          title: LocaleSetting
          properties:
            currency: {type: string, description: Currency code in ISO 4217 standard}
            time: {type: string, description: Time format preference. The allowed values are '12' and '24'.}
            firstDayOfWeek: {type: string, description: First day of week preference. The allowed values are 'Monday' and 'Sunday'.}
            weekNumbering: {type: string, description: 'Week numbering preference. The allowed values are ''ISO 8601'', ''Middle Eastern'', ''Western traditional'' and ''Broadcast Calendar''.'}
            date: {type: string, description: Date format preference. The format should follow RFC5646 language tag standard.}
            numericalRepresentation: {type: string, description: Numerical representation preference. The format should follow RFC5646 language tag standard.}
        socialIdentities:
          type: array
          maxItems: 5
          items:
            type: object
            title: SocialIdentity
            properties:
              socialId: {type: string, maxLength: 64}
              socialProvider: {type: string, description: 'The social provider of the user. The allowed values are TWITTER, FACEBOOK, GOOGLE, LINKEDIN and APPLE.'}
              dateOfLinking: {type: string, format: date-time}
        privacyPolicy:
          type: array
          items:
            type: object
            title: PrivacyPolicy
            properties:
              id: {type: string, maxLength: 36, example: 30ac69fe-5155-4d7f-8830-e9af6bf3e401}
              name: {type: string, maxLength: 64}
              version: {type: integer}
              locale: {type: string, maxLength: 8}
              timeOfAcceptance: {type: string, format: date-time}
        termsOfUse:
          type: array
          items:
            type: object
            title: TermsOfUse
            properties:
              id: {type: string, maxLength: 36, example: 30ac69fe-5155-4d7f-8830-e9af6bf3e401}
              name: {type: string, maxLength: 64}
              version: {type: integer}
              locale: {type: string, maxLength: 8}
              timeOfAcceptance: {type: string, format: date-time}
        passwordDetails:
          type: object
          title: PasswordDetails
          properties:
            loginTime: {type: string, format: date-time}
            failedLoginAttempts: {type: integer}
            setTime: {type: string, format: date-time}
            status: {type: string, description: 'The supported values for the status attribute are importedPassword, initial, enabled, and disabled. If the attribute password is provided, user is prompted to change the password on first logon. passwordStatus will be initial as a default value.'}
            passwordLockedTime: {type: string, format: date-time}
            policy: {type: string}
        emails:
          type: array
          maxItems: 20
          items:
            type: object
            title: ExtendedEmail
            properties:
              type: {type: string}
              value: {type: string, maxLength: 256}
              display: {type: string, maxLength: 128}
              primary: {type: boolean}
              verified: {type: boolean, description: 'If the attribute is not passed in the request body, the default value is false.'}
              verifiedTime: {type: string, format: date-time}
          description: Values should be equal to the values of the emails attribute in the user core schema when creating or updating user.
        addresses:
          type: array
          maxItems: 20
          items:
            type: object
            title: ExtendedAddress
            properties:
              formatted: {type: string, maxLength: 128}
              primary: {type: boolean}
              country: {type: string, maxLength: 32}
              locality: {type: string, maxLength: 512}
              postalCode: {type: string, maxLength: 64}
              region: {type: string, maxLength: 64}
              streetAddress: {type: string, maxLength: 512}
              streetAddress2: {type: string, maxLength: 512}
              type: {type: string, maxLength: 32}
          description: Values should be equal to the values of the address attribute in the user core schema when creating or updating user.
        corporateGroups:
          type: array
          maxItems: 1500
          items:
            type: object
            title: CorporateGroup
            properties:
              value: {type: string, maxLength: 128}
          description: This attribute is applicable for the corporate user store scenarios and contains the groups the user in the corporate user store is assigned to.
        phoneNumbers:
          type: array
          maxItems: 120
