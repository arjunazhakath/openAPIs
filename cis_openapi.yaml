              verified: {type: boolean, description: 'If the attribute is not passed in the request body, the default value is false.'}
              verifiedTime: {type: string}
          description: Values should be equal to the values of the phoneNumbers attribute in the user core schema when creating or updating user.
        sapBpidOrg:
          type: array
          items:
            type: object
            title: SapBpidOrg
