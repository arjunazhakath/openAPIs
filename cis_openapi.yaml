    post:
      tags: [Users]
      summary: Creates a user resource.
      description: |-
        When creating a user, the attribute **schemas** is mandatory. Other attributes such as **userName**, **displayName** and **emails** may be mandatory or not, but it depends on [Logon Alias configuration](https://help.sap.com/docs/cloud-identity-services/cloud-identity-services/configure-user-identifier-attributes). Depending on that configuration, emails, userName and displayName attributes can be required or optional, and unique or non-unique. When you create a user, if one or more of these attributes are configured as required and unique, the request body must contain the respective attributes. Once the user is created, **User ID** and **Global User ID** are automatically generated. The User ID field is unique and not editable. The Global User ID, on the other hand, is unique, and editable.
        <br><br> `Sending activation e-mail:` When а user is created, the **sendMail** attribute specifies whether an activation e-mail should be sent to the user or not. In addition, if **applicationId** is provided the application context can be specified, so configurations of that application like Home URL, Email Template Set, Branding may be applied to the account activation flow. Moreover, if sendMail attribute is missing or set to false and applicationId is provided, then an email will not be send, but the activationUrl will be returned in the response. Further if **targetUrl** is specified in the request - it will be used when the user is redirected at the end of the account activation flow, no matter if the application context is specified with configured home URL. Note that these attributes are not stored in the DB, they are only used for the user creation process. <br><br> `Status synchronization:` The **status** attribute in the SAP extension schema is consistent with the attribute **active** in the core schema. It supports the following values: "new", "active", "inactive". When you create  a user with attribute status, you should know that it needs to be synchronized with the attribute active. For example, if you create a user with status "new" or "inactive", the active attribute in the core schema must be false. Similarly, if the user will be with status "active", the active attribute must be true. <br><br> `Master data attributes:` The following attributes: **salutations** , **functions** , **departments** , **relationships** , **industries** , **timezones**, **languages** and **countries** are called **master data** attributes and have canonical values. The specific values for these attributes can be found on **tenantUrl/service/md/attribute** <br><br> `Password`: Password must comply to password policy attribute requirements: length, history and required character groups. <br><br> `Attributes details:` More attributes specifications can be found at the **Schema View** tab.
      operationId: createUser
      requestBody:
        content:
          application/scim+json:
            schema: {$ref: '#/components/schemas/User'}
            examples:
