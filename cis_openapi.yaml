              value: {type: string, maxLength: 36, description: The value of the SAP Business Partner ID (BPID) organization.}
        sapBpguidOrg:
          type: array
          items:
            type: object
            title: SapBpguidOrg
            properties:
              value: {type: string, maxLength: 36, description: The value of the SAP Business Partner GUID (BPGUID) organization.}
        sapBpidContact:
          type: array
          maxItems: 20
          items:
            type: object
            title: SapBpidContact
            properties:
              value: {type: string, maxLength: 64, description: The value of the SAP Business Partner ID (BPID) contact.}
        validFrom: {type: string, format: date-time, description: Specifies the time and date from which the user is valid. The Valid From and Valid To fields are empty if no validity dates are set for the user.}
        validTo: {type: string, format: date-time, description: Specifies the time and date to which the user is valid. The Valid From and Valid To fields are empty if no validity dates are set for the user.}
    UserExtensionSapOdm:
      type: object
      properties:
        workAssignment:
          type: array
          maxItems: 20
          items:
            type: object
            title: WorkAssignment
            description: A work assignment represents a specific work relationship to a company or legal entity.
            properties:
              id: {type: string, maxLength: 100, description: The ID of the work assignment.}
              externalId: {type: string, maxLength: 100, description: The id of the workAssignment – in case the OID is not present the ID from the source system.}
              isContingentWorker: {type: boolean, description: TRUE if the work assignment is of a contingent worker otherwise FALSE.}
              startDate: {type: string, format: date-time, description: The start date of the work assignment.}
              endDate: {type: string, format: date-time, description: The end date of the work assignment.}
              primary: {type: boolean, description: TRUE if this work assignment is the primary one otherwise FALSE.}
        jobDetails:
          type: array
          maxItems: 20
          items:
            type: object
            title: JobDetail
            description: The details of the job related to the user
            properties:
              workAssignmentId: {type: string, maxLength: 100, description: The oId of the corresponding workAssignment.}
              orgUnit: {type: string, maxLength: 128, description: Lowest grouping level. Corresponds to department in SAP SuccessFactors. This is filled by division or business unit in case customer does not use all levels.}
              superOrdinateOrgUnit1: {type: string, maxLength: 128, description: Second level of grouping. Corresponds to division in SAP SuccessFactors.}
              superOrdinateOrgUnit2: {type: string, maxLength: 128, description: Topmost level of grouping. Corresponds to business unit in SAP SuccessFactors.}
              jobClassification: {type: string, maxLength: 128, description: Reference to the corresponding jobClassication.}
              legalEntity: {type: string, maxLength: 4, description: Company Code associated with the job.}
              costCenter: {type: string, maxLength: 30, description: The cost center.}
              startDate: {type: string, format: date-time, description: The start date.}
              endDate: {type: string, format: date-time, description: The end date.}
              jobTitle: {type: string, maxLength: 256, description: A name that identifies an employee’s job.}
              country: {type: string, maxLength: 128, description: The country or region where employees perform their job or assignment.}
              primary: {type: boolean, description: TRUE if this is the primary one otherwise FALSE.}
        workforcePersonId: {type: string, maxLength: 100, description: The UUID of the WorkforcePerson.}
        jobClassification:
          type: array
          maxItems: 20
          items:
            type: object
            title: JobClassification
            description: To classify a Job and assign it to a Job code.
            properties:
              workAssignmentId: {type: string, maxLength: 100, description: The oId of the corresponding workAssignment.}
              oId: {type: string, maxLength: 128, description: The SAP ODM ID if applicable.}
              externalId: {type: string, maxLength: 128, description: The externalId of the job in the supplying system.}
              name: {type: string, maxLength: 90, description: Job Name.}
              description: {type: string, maxLength: 4000, description: The job description.}
              source: {type: string, maxLength: 64, description: The source system.}
        organizationalUnit:
          type: array
          maxItems: 20
          items:
            type: object
            title: OrganizationalUnit
            description: The Organizational Unit in the domain human resources is the organizational unit where people work.
            properties:
              primary: {type: boolean, description: The primary organizationalUnit and the corresponding name define the department-field of the enterprise.schema}
              oId: {type: string, maxLength: 128, description: The SAP ODM ID if applicable}
              externalId: {type: string, maxLength: 128, description: The id of the department defined in the source system (for technical integrations)}
              name: {type: string, maxLength: 128, description: The name of the organizational unit.}
              description: {type: string, maxLength: 256, description: The description of the organizational unit.}
              isActive: {type: boolean, description: TRUE if this organizational unit is active otherwise FALSE.}
              category: {type: string, description: 'Indicates the category of the Human Resources Organizational Unit, by default Department, Division or Business Unit.'}
              source: {type: string, maxLength: 64, description: The tenant id of the source system}
        costCenter:
          type: array
          maxItems: 20
          items:
            type: object
            title: CostCenter
            description: Cost center is an organizational unit that represents a defined location of cost incurrence. This is the default cost center of the user.
            properties:
              oId: {type: string, maxLength: 128, description: 'ODM unique identifier - in an SAP landscape this value has priority compared to the combination of companyCode,ID and source.'}
              costCenterId: {type: string, maxLength: 10, description: The ID of the cost center.}
              logicalSystem: {type: string, maxLength: 10, description: The logicalSystem.}
              controllingArea: {type: string, maxLength: 4, description: The controlling area.}
              organizationalUnitId: {type: string, maxLength: 128, description: The ID of the organizational unit.}
              workAssignmentId: {type: string, maxLength: 100, description: The id of the work assignment.}
              displayName: {type: string, maxLength: 30, description: The value of the CostCenter - the value for the primary costCenter is also used for the SCIM enterprise schema.}
              legacyId: {type: string, maxLength: 36, description: The legacy Id.}
              companyCodeId: {type: string, maxLength: 4, description: The ID of the companyCode.}
              primary: {type: boolean, description: TRUE if this is the primary cost center otherwise FALSE.}
        plant:
          type: array
          maxItems: 20
          items:
            type: object
            title: Plant
            description: An organizational unit for dividing an enterprise according to production, procurement, maintenance, and materials planning.
            properties:
              oId: {type: string, maxLength: 128, description: 'The One Domain Model identifier of the plant, consisting of the context ID and the local ID.'}
              displayId: {type: string, maxLength: 4, description: The human-readable identifier of the plant.}
              name: {type: string, maxLength: 30, description: The name of the plant.}
              companyCodeId: {type: string, maxLength: 128, description: The ID of the companyCode.}
              primary: {type: boolean, description: TRUE if it is the primary plant otherwise FALSE.}
        companyCode:
          type: array
          maxItems: 20
          items:
            type: object
            title: CompanyCode
            description: The smallest organizational unit in financial accounting for which individual financial statements for external reporting are drawn, such as balance sheets and profit and loss accounts.
            properties:
              workAssignmentId: {type: string, maxLength: 100, description: The ID of the workAssignment.}
              primary: {type: boolean, description: TRUE if it is the primary company code otherwise FALSE. The primary company code and the corresponding name define the organization-field of the enterprise.schema}
              name: {type: string, maxLength: 25, description: The name of the company code.}
              company: {type: string, maxLength: 6, description: The company of the company code.}
              displayId: {type: string, maxLength: 4, description: The ID of the company code.}
              oId: {type: string, maxLength: 128, description: 'The One Domain Model identifier of the company code, consisting of the context ID and the local ID.'}
              source: {type: string, maxLength: 64, description: The tenant id of the source system.}
              country: {type: string, maxLength: 128, description: The country (e.g. US).}
              language: {type: string, maxLength: 128, description: The language (e.g. en_US).}
        generalLedgerAccount:
          type: array
          maxItems: 20
          items:
            type: object
            title: GeneralLedgerAccount
            description: The general ledger account.
            properties:
              oId: {type: string, maxLength: 128, description: The SAP ODM ID if applicable.}
              primary: {type: boolean, description: TRUE if it is the primary general ledger account otherwise FALSE.}
              companyCodeId: {type: string, maxLength: 36, description: The ID of the companyCode.}
              displayId: {type: string, maxLength: 36, description: The ID of the general ledger account.}
              externalNumber: {type: string, maxLength: 36, description: The external number.}
              name: {type: string, maxLength: 64, description: The name of the general ledger account.}
              source: {type: string, maxLength: 64, description: The source system of the general ledger account.}
        purchasingOrganization:
          type: array
          maxItems: 20
          items:
            type: object
            title: PurchasingOrganization
            description: From the materials management and purchasing view, the purchasing organization is responsible for all purchasing activities, including processing requests for quotations and purchase orders, for example.
            properties:
              oId: {type: string, maxLength: 128, description: The SAP ODM ID if applicable.}
              primary: {type: boolean, description: TRUE if is the primary purchasing organization otherwise FALSE.}
              plantId: {type: string, maxLength: 128, description: The ID of the plant.}
              companyCodeId: {type: string, maxLength: 128, description: The ID of the companyCode.}
              displayId: {type: string, maxLength: 4, description: The ID of the PurchasingOrganization.}
              name: {type: string, maxLength: 20, description: The name of the purchasing organization.}
        purchasingGroup:
          type: array
          maxItems: 20
          items:
            type: object
            title: PurchasingGroup
            description: A purchasing group is a group of buyers who are responsible for certain purchasing activities. The purchasing group is internally responsible for the procurement of a material or a class of materials. The purchasing group is the principal channel for dealings of a company with its vendors.
            properties:
              oId: {type: string, maxLength: 128, description: The SAP ODM ID if applicable.}
              primary: {type: boolean, description: TRUE if it is the primary purchasing group otherwise FALSE.}
              displayId: {type: string, maxLength: 36, description: The ID of the purchasing group.}
              description: {type: string, maxLength: 256, description: The description of the purchasing group.}
    UserExtensionSapAriba:
      type: object
      properties:
        businessSystemId: {type: string, maxLength: 128}
      description: This extension is not included in the default response when reading an user. It must be explicitly specified in the 'attributes' query parameter in order to be returned.
    Group:
      type: object
      description: Represents a SCIM Group resource. See [RFC 7643](https://datatracker.ietf.org/doc/html/rfc7643#section-4.2) for more details.
      required: [schemas, displayName]
      properties:
        id: {type: string, description: The unique identifier of the group.}
        meta: {$ref: '#/components/schemas/Meta'}
        schemas:
          type: array
          default: ['urn:ietf:params:scim:schemas:core:2.0:Group']
          description: The body of each request MUST contain the "schemas" attribute with the URI value of "urn:ietf:params:scim:schemas:core:2.0:Group"
          items: {type: string}
        displayName: {type: string, maxLength: 256, description: The display name of the group. This is a human-readable name that identifies the group.}
        members:
          type: array
          description: A list of members that are part of the group. Each member is represented by a reference to a User or Group resource.
          items:
            type: object
            title: MemberRef
            required: [value]
            properties:
              value: {type: string, description: The unique identifier of the member. This is either the User or Group resource identifier.}
              type: {type: string, description: 'The type of the member. This can be "User" or "Group". If not specified, it defaults to "User".'}
              $ref: {type: string, description: The URI of the member resource. This is typically a reference to the User or Group resource.}
            additionalProperties: true
        externalId: {type: string, maxLength: 256, description: 'Unique and global identifier for the given group, see also RFC 7643, chapter 3.1 and Technology Guideline 16, requirement 3.'}
      additionalProperties:
        type: object
        description: "SCIM extensions allow the API to support custom attributes or additional \nschemas beyond the standard SCIM specification. API consumers can use \nthese extensions to store and retrieve organization-specific or \napplication-specific data, enabling greater flexibility and extensibility \nin user and group management. Extensions are typically identified by \ntheir unique URN and should be handled according to the extension \ndocumentation provided by the API.\n\nSee predefined extension schemas: \n* urn:sap:cloud:scim:schemas:extension:custom:2.0:Group - see the \"GroupExtensionCustom\" schema definition below. \n* urn:ietf:params:scim:schemas:extension:sap:2.0:Group - see the \"GroupExtensionSap\" schema definition below.\n"
    GroupExtensionCustom:
      type: object
      properties:
        additionalId: {type: string}
        name: {type: string, maxLength: 256}
        description: {type: string}
    GroupExtensionSap:
      type: object
      properties:
        applicationId: {type: string, description: The applicationId must be a valid SCI application ID.}
        type: {type: string, description: 'The type of the group. The allowed values are "userGroup", "authorization", "deepLinkActivationPermission" and "license". Type "license" is reserved for internal use only. The default value for type is "userGroup".'}
        supportedOperations: {type: string, description: 'The supported group operations on application side. The allowed values are "readOnly", "readWrite", "userOnlyMembership" and "membership". The default value for supportedOperations is "readWrite".'}
        externalName: {type: string, maxLength: 256, description: 'The external name of the group is unique within the Application. Two groups with same externalName for two different applications can be created, but the same scenario for one application is not allowed. The value is immutable.'}
        externalLocation: {type: string, format: url, description: Specifies the location of the source group as a valid URL. The value is immutable.}
        children:
          type: array
          description: A list of child groups. This is used to represent hierarchical group structures.
          items:
            type: object
            title: GroupChild
            properties:
              value: {type: string, description: The unique identifier of the child group.}
              $ref: {type: string, description: The URI of the child group resource.}
    Schema:
      type: object
      description: Specifies the schema that describes a SCIM schema. See [RFC 7643](https://datatracker.ietf.org/doc/html/rfc7643#section-2) for more details.
      required: [id, schemas, attributes]
      properties:
        id: {type: string, description: The unique URI of the schema.}
        name: {type: string, description: 'The schema''s name, e.g., "User", "Group", "ResourceType".'}
        description: {type: string, description: A human-readable description of the schema.}
        meta: {$ref: '#/components/schemas/Meta'}
        schemas:
          type: array
          default: ['urn:ietf:params:scim:schemas:core:2.0:Schema']
          description: The body of each request MUST contain the "schemas" attribute with the URI value of "urn:ietf:params:scim:schemas:core:2.0:Schema"
          items: {type: string}
        attributes:
          type: array
          description: A collection of attributes that define the schema. Each attribute is defined by its name, type, mutability, and other characteristics.
          items: {$ref: '#/components/schemas/Attribute'}
    Attribute:
      title: Attribute
      description: See [RFC 7643](https://datatracker.ietf.org/doc/html/rfc7643#section-2.1) for more details.
      properties:
        name: {type: string, description: The attribute's name. Should not exceed 30 characters and can contain only alphanumeric characters or underscore.}
        type: {type: string, description: 'The attribute''s data type. Valid values include ''string'', ''complex'', ''boolean'', ''decimal'', ''integer'', ''dateTime'', ''reference''.'}
        multiValued: {type: boolean, description: A Boolean value indicating an attribute's plurality.}
        description: {type: string, description: A human-readable description of the attribute.}
        required: {type: boolean, description: A Boolean value indicating whether or not the attribute is required.}
        canonicalValues:
          type: array
          items: {type: string}
          description: A collection of suggested canonical values that MAY be used.
        caseExact: {type: boolean, description: A Boolean value indicating whether or not a string attribute is case sensitive.}
        mutability: {type: string, description: 'Indicates whether or not an attribute is modifiable. Valid values include ''readOnly'', ''readWrite'', ''writeOnly'', ''immutable''.'}
        returned: {type: string, description: 'Indicates when an attribute is returned in a response (e.g., to a query). Valid values include ''always'', ''never'', ''default'', ''request''.'}
        uniqueness: {type: string, description: 'Indicates how unique a value must be. Valid values are ''none'', ''server'', ''global''.'}
        referenceTypes:
          description: This attribute is only applicable for attributes that are of type "reference". Specifies a SCIM resourceType that a reference attribute MAY refer to, e.g., 'User'."
          type: array
          items: {type: string}
        subAttributes:
          type: array
          description: Used to define the sub-attributes of a complex attribute.
          items: {$ref: '#/components/schemas/Attribute'}
    ResourceType:
      type: object
      description: Specifies the metadata about a resource type. Resource type resources are READ-ONLY.
      properties:
        meta: {$ref: '#/components/schemas/Meta'}
        id: {type: string, description: The resource type's server unique id.}
        schemas:
          type: string
          items: {type: string}
          default: ['urn:ietf:params:scim:schemas:core:2.0:ResourceType']
        name: {type: string, description: The resource type's name.}
        description: {type: string, description: The resource type's human-readable description.}
        endpoint: {type: string, description: The resource type's HTTP-addressable endpoint relative to the Base URL of the service provider}
        schema: {type: string, description: 'The resource type''s primary/base schema URI, e.g., "urn:ietf:params:scim:schemas:core:2.0:User"'}
        schemaExtensions:
          type: array
          description: A list of URIs of the resource type's schema extensions
          items:
            type: object
            title: SchemaExtension
            properties:
              schema: {type: string, description: 'The URI of an extended schema, e.g., "urn:edu:2.0:Staff"'}
              required: {description: 'A Boolean value that specifies whether or not the schema extension is required for the resource type. If true, a resource of this type MUST include this schema extension and also include any attributes declared as required in this schema extension', type: boolean}
    PatchBody:
      type: object
      description: See [RFC 7644](https://tools.ietf.org/html/rfc7644#section-3.5.2) for more details.
      required: [schemas, Operations]
      properties:
        schemas:
          type: array
          default: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
          description: The body of each request MUST contain the "schemas" attribute with the URI value of "urn:ietf:params:scim:api:messages:2.0:PatchOp"
          items: {type: string}
        Operations:
          type: array
          items:
            type: object
            title: PatchOperation
            properties:
              op: {type: string, description: 'Indicates the operation to perform. Valid values are "add", "remove", or "replace".'}
              path: {type: string, description: An attribute path describing the target of the operation.}
              value: {$ref: '#/components/schemas/AnyObject'}
    Meta:
      type: object
      description: A complex attribute containing resource metadata.  All "meta" sub-attributes are assigned by the service provider (have a "mutability" of "readOnly"), and all of these sub-attributes have a "returned" characteristic of "default".  This attribute SHALL be ignored when provided by clients.
      properties:
        created: {type: string, description: The "DateTime" that the resource was added to the service provider.}
        lastModified: {type: string, description: 'The most recent DateTime that the details of this resource were updated at the service provider. If this resource has never been modified since its initial creation, the value is the same as the value of "created".'}
        location: {type: string, description: Resource location URI}
        resourceType: {type: string, description: 'The resource type of the resource, e.g., "User", "Group", "ResourceType". This value is used to identify the type of the resource in the SCIM API.'}
        version: {type: string, description: 'The version of the resource, which is a unique identifier that changes whenever the resource is modified.'}
      additionalProperties: true
    SearchResult:
      type: object
      properties:
        schemas:
          type: array
          description: A list of one or more URIs which are used to indicate the SCIM schemas that define the allowed attributes for a resource.
          items: {type: string}
          default: ['urn:ietf:params:scim:api:messages:2.0:ListResponse']
        totalResults: {type: integer, description: Specifies the total number of results matching the query., example: 100}
        itemsPerPage: {type: integer, description: Specifies the maximum number of query results returned in a query response page., example: 3}
        startIndex: {type: integer, description: The 1-based index of the first result in the current set of query results (only if parameter startIndex is used)., example: 1}
        startId: {type: string, description: Specifies the first entry of the query result (only if parameter startId is used)., example: initial}
        nextId: {type: string, description: 'Specifies the next user ID (that is, the ID of the first user on the next page). For example `<user id>` or `<end>`. The `<end>` value indicates that the last user of the total number of users matching the query is returned  (only if parameter startId is used).', example: 00000000-0000-0000-0000-000000000000}
        nextCursor: {type: string, description: 'Specifies the next cursor (that is, the value representing the first user on the next page). For example `<nextCursor>`. If there is not `<nextCursor>` value, this means that this is the last page of the query.', example: MDAwZTI1ODItMzE3ZS00Y2IwLTgyYjQtODlkZTdhZDY2MGM2, x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'}
      discriminator: {propertyName: type}
    ErrorResponse:
      type: object
      description: The ErrorResponse object is used to represent error responses in the SCIM API.  It contains information about the error that occurred, including the error code, type, and a detailed message.
      properties:
        schemas:
          type: array
          items: {type: string}
          default: ['urn:ietf:params:scim:api:messages:2.0:Error']
        status: {type: string, description: Error Code}
        scimType: {type: string, description: SCIM Type of the error.}
        detail: {type: string, description: Detailed error message}
    AnyObject: {type: object, description: 'A flexible object type that can represent any JSON structure.  Used in SCIM patch and bulk operations to support arbitrary,  extensible data, enabling clients to specify complex or  custom attribute values as needed.'}
  responses:
    '500':
      description: Internal Server Error - please open a ticket to [BC-IAM-IDS](https://help.sap.com/docs/identity-authentication/identity-authentication/getting-support)
      content:
        application/scim+json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            status: 500
            schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
            detail: Internal Server Error
    '401':
      description: Unauthorized
      content:
        application/scim+json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            status: 401
            schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
            detail: Authentication credentials are invalid or not allowed for this endpoint.
    '403':
      description: You don't have permissions to do this operation.
      content:
        application/scim+json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            status: 403
            schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
            detail: Forbidden
    '409':
