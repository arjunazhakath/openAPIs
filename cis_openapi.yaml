          schema: {$ref: '#/components/schemas/ErrorResponse'}
          example:
            status: 409
            schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
            detail: Group with the same type and external name already exists for the application.
    '429':
      description: |
        [Too Many Requests](https://help.sap.com/docs/identity-authentication/identity-authentication/rate-limiting-and-throttling)
