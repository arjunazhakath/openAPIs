      description: Updates one or more attributes of a group. If attribute, provided in path is non-qualified, then it will be qualified only with Group resource core schema urn:ietf:params:scim:schemas:core:2.0:Group. In case you want to add a group member through add operation, you need to provide the id of the user as a value of the relevant field in the patchbody. <br><br> `Authorization Policy Groups Limitations:` Authorization Policy groups cannot be created or deleted. They can be only edited by **adding/removing members**, changing **displayName** and **description**.
