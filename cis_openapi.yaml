              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                status: 404
                schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
                detail: User <user_id> not found!
        '500': {$ref: '#/components/responses/500'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '429': {$ref: '#/components/responses/429'}
    patch:
      tags: [Users]
      summary: Updates specific attributes of a user.
      description: Updates one or more attributes of a user. Depending on the [Logon Alias configuration](https://help.sap.com/docs/cloud-identity-services/cloud-identity-services/configure-user-identifier-attributes), the e-mail, loginName and displayName attributes can be required or optional and unique or non-unique. When you update a user, if one or more of these attributes are configured as required and unique, the request payload must contains the respective attributes. If you want to execute a patch request, including replace operation for the emails, the choice of the email's primary field value which is passed to the patchbody, is significant. In case that you are passing an email with missing primary value through the replace operation or it is false, it will be set automatically to true. Also, if the emails in the patchbody are more than one and for each of them the primary value is missing or it is false, the last email's primary will be set to true and the others will be set to false. However, if you set one of the emails primary to true, all other emails primary value will be set automatically to false. For the phone attribute, only unique field can be changed. If it is enabled, we can't create or edit a user with phone number that already exists.
      operationId: patchUser
      parameters:
      - name: Id
        in: path
        required: true
        description: The ID of the user to be patched.
        schema: {type: string}
      requestBody:
        content:
          application/scim+json:
            schema: {$ref: '#/components/schemas/PatchBody'}
            examples:
              add:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - op: add
                    value:
                      emails:
                      - {value: john.smith@example.com, type: home}
                  - op: add
                    path: urn:ietf:params:scim:schemas:extension:sap:2.0:User:corporateGroups
                    value:
                    - {value: admin}
                  - {op: add, path: 'urn:ietf:params:scim:schemas:extension:sap:2.0:User:userUuid', value: f9531e7c-67f2-4594-b978-a8e18fe31886}
                summary: Multiple add operations.
              addCustomAttribute:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - op: add
                    path: urn:sap:cloud:scim:schemas:extension:custom:2.0:User:attributes
                    value:
                    - {name: customAttribute1, value: admin}
                summary: Add user custom attribute.
              removeEnterpriseAndCustomAttributes:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - {op: remove, path: 'urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:department'}
                  - {op: remove, path: 'urn:ietf:params:scim:schemas:extension:sap:2.0:User:sapUserName'}
                summary: Remove enterprise and extension attribute.
              removeAndAdd:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - {op: remove, path: 'emails[type eq "work" and value eq "john.smith@example.com"]'}
                  - {op: add, path: nickName, value: John23}
                summary: Remove an email by type and value and add a nickname.
              removeCustomAttributes:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - {op: remove, path: 'urn:sap:cloud:scim:schemas:extension:custom:2.0:User:attributes[name eq "customAttribute1"]'}
                  - {op: remove, path: 'urn:sap:cloud:scim:schemas:extension:custom:2.0:User:attributes[name eq "customAttribute2"]'}
                summary: Remove user custom attributes.
              replaceCustomAttributes:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - {op: replace, path: 'urn:sap:cloud:scim:schemas:extension:custom:2.0:User:attributes[name eq "customAttribute1"].value', value: customAttributeValue}
                summary: Replace user custom attribute.
              replaceWorkPhone:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - op: replace
                    path: phoneNumbers[type eq "work" and value eq "123"]
                    value:
                    - {value: '456', display: John Smith, primary: false, type: work}
                summary: Replace your work phone number with a new value.
              replaceEmailWithEmptyPrimary:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - op: replace
                    path: emails
                    value:
                    - {value: john.smith@example.com}
                summary: Replace an email.
              replaceAllEmailAttributesUsingExtensionSchema:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - op: replace
                    path: urn:ietf:params:scim:schemas:extension:sap:2.0:User:emails
                    value:
                    - {type: home, value: john.smith@example.com, display: email4, primary: true, verified: true}
                summary: Replace email subattributes by using extension custom schema as a path.
              replaceCorporateGroup:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - op: replace
                    path: urn:ietf:params:scim:schemas:extension:sap:2.0:User:corporateGroups
                    value:
                    - {value: admin}
                summary: Replace corporate groups.
              replaceMoreThanOneEmails:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - op: replace
                    value:
                      emails:
                      - {value: john.smith@example.com, type: home, primary: true}
                      - {value: john.smith2@example.com, type: work, primary: false}
                summary: Replace more than one email of the user.
              addApplicationUserToExistingUser:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - op: add
                    path: urn:ietf:params:scim:schemas:extension:sap.application:2.0:User:applicationUsers
                    value:
                    - {applicationId: d4e5f6a7-b8c9-0123-4567-89abcdef0123, nameId: john.smith, status: active}
                summary: Add application user to an existing user.
              replaceSingleApplicationUserAttribute:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - {op: replace, path: 'urn:ietf:params:scim:schemas:extension:sap.application:2.0:User:applicationUsers[applicationId eq "d4e5f6a7-b8c9-0123-4567-89abcdef0123"].status', value: inactive}
                summary: Replace a single application user attribute.
              replaceApplicationUser:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - op: replace
                    path: urn:ietf:params:scim:schemas:extension:sap.application:2.0:User:applicationUsers[applicationId eq "d4e5f6a7-b8c9-0123-4567-89abcdef0123"]
                    value:
                    - {applicationId: d4e5f6a7-b8c9-0123-4567-89abcdef0123, nameId: john.doe, status: active}
                summary: Replace an application user.
              removeApplicationUser:
                value:
                  schemas: ['urn:ietf:params:scim:api:messages:2.0:PatchOp']
                  Operations:
                  - {op: remove, path: 'urn:ietf:params:scim:schemas:extension:sap.application:2.0:User:applicationUsers[applicationId eq "d4e5f6a7-b8c9-0123-4567-89abcdef0123"]'}
                summary: Remove an application user.
      responses:
        '204': {description: 'The user is updated successfully. If you are passing an email with missing primary value through the replace operation or it is false, it will be set automatically to true. In case you are setting the SAP  extension custom schema with an attribute as a path for replace operation, you should know that only the subattributes that are passed in the request body will be updated and the rest will be unchanged.'}
        '400':
          description: The provided identifier is not valid.
          content:
            application/scim+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                status: 400
                schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
                detail: 0404ac956ebf4d5889aec6e3a410fed5 is not a valid identifier!
        '404':
          description: The user with the provided ID does not exist.
          content:
            application/scim+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                status: 404
                schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
                detail: User <user_id> not found!
        '409':
          description: The updated user does not fulfill the uniqueness criteria for certain fields.
          content:
            application/scim+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                status: 409
                schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
                detail: A user with the same primary email already exists!
        '500': {$ref: '#/components/responses/500'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '429': {$ref: '#/components/responses/429'}
  /Groups:
    get:
      tags: [Groups]
      summary: Retrieves a group resource.
      description: Retrieves a list of groups. Paging parameters are supported.
      operationId: getGroups
      parameters:
      - name: filter
        in: query
        description: |-
          Defines the search criteria. Possible attribute is displayName. Supports up to 90 operands by unique attribute per request. It is not recommended to use more than 50 operands per request due to the database limitations.
          Supported operators:
          | Operator | Behavior |
          |---- | ------------- |
          | eq | The attribute and operator values must be identical for a match.|
          | ne | The attribute and operator values must not be identical for a match.|
          | gt | If the attribute value is greater than the operator value, there is a match. The actual comparison is dependent on the attribute type. For string attribute types, this is a lexicographical comparison, and for DateTime types, it is a chronological comparison. For integer attributes, it is a comparison by numeric value.|
          | lt | If the attribute value is less than the operator value, there is a match. The actual comparison is dependent on the attribute type. For string attribute types, this is a lexicographical comparison, and for DateTime types, it is a chronological comparison. For integer attributes, it is a comparison by numeric value.|
          | and | The filter is only a match if both expressions evaluate to true.|
          | or | The filter is a match if one of both expressions evaluate to true.|
          ### Supported Group Search Attributes:
          #### Core Schema
            * displayName
            * externalId
            * meta.lastModified

          #### Internal Schemas
            * urn:sap:cloud:scim:schemas:extension:custom:2.0:Group:**additionalId**
            * urn:sap:cloud:scim:schemas:extension:custom:2.0:Group:**name**
            * urn:ietf:params:scim:schemas:extension:sci:2.0:Authorization:**authorizationId**
            * urn:ietf:params:scim:schemas:extension:sci:2.0:Authorization:**type**
            * urn:ietf:params:scim:schemas:extension:sap:2.0:Group:**applicationId**
            * urn:ietf:params:scim:schemas:extension:sap:2.0:Group:**externalName**
            * urn:ietf:params:scim:schemas:extension:sap:2.0:Group:**type**
        required: false
        schema: {type: string}
        examples:
          smith: {value: displayName eq "Administrators", summary: Search by displayName.}
          name: {value: 'urn:sap:cloud:scim:schemas:extension:custom:2.0:Group:name eq "test"', summary: Search by name.}
          additionalId: {value: 'urn:sap:cloud:scim:schemas:extension:custom:2.0:Group:additionalId eq "60ebebc3a2aef74f1bf81c63"', summary: Search by additionalId.}
          applicationIdAndAuthorizationId: {value: 'urn:ietf:params:scim:schemas:extension:sap:2.0:Group:applicationId eq "ae914037-5168-4c38-9b1c-d438f56f0f62" and urn:ietf:params:scim:schemas:extension:sci:2.0:Authorization:authorizationId eq "f71747a5-f4b6-59f3-ae05-ffd11e47a745"', summary: Search by applicationId and authorizationId.}
          externalId: {value: externalId eq "admin_ext", summary: Search by externalId.}
      - name: startId
        in: query
        description: |
          Used for Id-Based pagination. Page through groups by specifying `startId` parameter.
          Possible values:
          | Value | Description |
          |------------ | ------------- |
          | `initial`| If initial value is specified, the initial group is returned as the first entry of the query result. |
          | `<group ID>` | If `<group id>` value is specified, the group with this group ID is returned as the first entry of the query result.|
        required: false
        schema: {type: string}
        examples:
          initial: {value: displayName eq "Administrators"&startId=initial, summary: Search by displayName using initial id.}
          Id: {value: startId=fd3d9e48-f7c0-4cb9-b364-1814ae9d99d4&count=5, summary: Search by group id.}
      - name: cursor
        in: query
        description: |
          Used for Cursor-Based pagination. Page through groups by specifying `cursor` parameter.
          Possible values:
          | Value | Description |
          |------------ | ------------- |
          | ``| If an empty value is specified, the initial groups is returned as the first entry of the query result. |
          | `<nextCursor>` | If `<nextCursor>` value is specified, the next page with groups is returned and the first entry of the query result corresponds to the cursor value. |
        required: false
        schema: {type: string}
        examples:
          emptyCursor: {value: displayName eq "Administrators"&cursor, summary: Search by displayName using empty cursor.}
          cursor: {value: cursor=ZmQzZDllNDgtZjdjMC00Y2I5LWIzNjQtMTgxNGFlOWQ5OWQ0&count=5, summary: Search by specifying the cursor.}
      - name: count
        in: query
        description: Represents the number of items which will be returned per page. A negative value is interpreted as 0. A value of 0 indicates that no resource results are to be returned.
        required: false
        schema: {type: integer, default: 100}
      - name: attributes
        in: query
        required: false
        description: A multi-valued list that indicates attributes names in standard notation to return in the response, overriding the set of attributes that would be returned by default, except minimal Group representation which is always returned. When attribute 'members' is part of the attributes, then id, index or cursor paging shall be used in the query.
        schema: {type: string}
        examples:
          cursor_page: {value: members%5Bcursor%3D%26count%3D100%5D, summary: Get members by cursor paging, description: 'This value is used to query the members of the group using `cursor` and `count`. Max `count` value only for members query is `20000`. The default value of `count` for the rest of the queries is `100`. The same rules apply when using standard resource paging. The example value is URL encoded because it contains characters which are reserved according to the URI Generic Syntax specification (RFC 3986). The original value before encoding is **members[cursor=&count=100]**.'}
          id_page: {value: members%5BstartId%3Dinitial%26count%3D100%5D, summary: Get members by id paging, description: 'This value is used to query the members of the group using `startId` and `count`. Max `count` value only for members query is `20000`. The default value of `count` for the rest of the queries is `100`. The same rules apply when using standard resource paging. The example value is URL encoded because it contains characters which are reserved according to the URI Generic Syntax specification (RFC 3986). The original value before encoding is **members[startId=initial&count=100]**.'}
          index_page: {value: members%5BstartIndex%3D1%26count%3D100%5D, summary: Get members by index paging, description: 'This value is used to query the members of the group using `startIndex` and `count`. Max `count` value only for members query is `20000`. The default value of `count` for the rest of the queries is `100`.  The same rules apply when using standard resource paging. The example value is URL encoded because it contains characters which are reserved according to the URI Generic Syntax specification (RFC 3986). The original value before encoding is **members[startIndex=1&count=100]**.'}
          members_values: {value: members.value, summary: Get only members values, description: This value is used to query only the value attribute of members of the group.}
      - name: excludedAttributes
        in: query
        required: false
        description: A multi-valued list that indicates attributes names in standard notation to exclude from the response, overriding the set of attributes that would be returned by default, except minimal Group representation which is always returned.
        schema: {type: string}
        examples:
          exclude_members: {value: members, summary: Get only group attributes excluding members, description: This value is used to query the the group attributes excluding members list.}
      responses:
        '200':
          description: The group resource is retrieved successfully. The maximum number of returned members per request is 20 000.
          content:
            application/scim+json:
              schema:
                type: object
                title: SearchResultGroups
                allOf:
                - {$ref: '#/components/schemas/SearchResult'}
                - type: object
                  properties:
                    Resources:
                      type: array
                      items: {$ref: '#/components/schemas/Group'}
              examples:
                searchById:
                  description: |
                    The following paging attributes are returned in the response:
                    | Value | Description |
                    |------------ | ------------- |
                    | totalResults | Specifies the total number of results matching the query, for example: 100. |
                    | itemsPerPage | Specifies the maximum number of query results returned in a query response page, for example: 3.|
                    | startId | Specifies the first entry of the query result, for example: initial or `<user id>`.|
                    | nextId | Specifies the next user ID (that is, the ID of the first user on the next page). For example: `<user id>` or `<end>`. The `<end>` value indicates that the last user of the total number of users matching the query is returned.|
                  value:
                    Resources:
                    - id: <group_id>
                      meta: {created: '2020-10-14T14:33:39Z', lastModified: '2020-10-14T14:33:39Z', location: 'https://tenant.accounts.ondemand.com/scim/Groups/<group_id>', version: <version_id>, resourceType: Group}
                      schemas: ['urn:ietf:params:scim:schemas:core:2.0:Group', 'urn:sap:cloud:scim:schemas:extension:custom:2.0:Group']
                      displayName: Tour Guides1
                      members:
                      - {value: <member_id>, $ref: 'https://tenant.accounts.ondemand.com/scim/Users/<member_id>', type: User}
                    totalResults: 1
                    itemsPerPage: 100
                    startIndex: 1
                    schemas: ['urn:ietf:params:scim:api:messages:2.0:ListResponse']
                searchByIndex:
                  description: |
                    The following paging attributes are returned in the response:
                    | Value | Description |
                    |------------ | ------------- |
                    | totalResults | Specifies the total number of results matching the query, for example: 100. |
                    | itemsPerPage | Specifies the maximum number of query results returned in a query response page, for example: 3.|
                    | startIndex | The 1-based index of the first result in the current set of query results, for example: 1.|
                  value:
                    Resources:
                    - id: 9eda8cdd-f612-494e-8bcd-4384f2b05317
                      meta: {created: '2020-10-27T15:45:39Z', lastModified: '2020-10-27T15:45:39Z', location: 'https://tenant.accounts.ondemand.com/scim/Groups/9eda8cdd-f612-494e-8bcd-4384f2b05317', version: 58521c4d-4020-48d3-94bb-fa6783aa489b, resourceType: Group}
                      schemas: ['urn:ietf:params:scim:schemas:core:2.0:Group', 'urn:sap:cloud:scim:schemas:extension:custom:2.0:Group']
                      displayName: Tour Guides1
                      urn:sap:cloud:scim:schemas:extension:custom:2.0:Group: {name: 9eda8cdd-f612-494e-8bcd-4384f2b05317, additionalId: 5f9840a345404f359f3c7fbd}
                    totalResults: 23
                    itemsPerPage: 1
                    startIndex: 2
                    schemas: ['urn:ietf:params:scim:api:messages:2.0:ListResponse']
                searchByCursor:
                  description: |
                    The following paging attributes are returned in the response:
