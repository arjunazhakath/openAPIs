  /Users/{Id}:
    get:
      summary: Retrieves a specific user.
      description: Retrieves a specific user by id.
      operationId: getUser
      tags: [Users]
      parameters:
      - name: Id
        in: path
        required: true
        description: The ID of the user to be retrieved.
        schema: {type: string}
      - name: attributes
        in: query
        required: false
        description: A multi-valued list that indicates attributes names in standard notation to return in the response, overriding the set of attributes that would be returned by default, except minimal User representation which is always returned. When attribute 'groups' is part of the attributes, then id or index paging shall be used in the query. Attributes and excludedAttributes are mutually exclusive. Attributes are prioritized over excludedAttributes when both of them are present in the same request.
        schema: {type: string}
        examples:
          cursor_page: {value: groups%cursor%3D%26count%3D100%5D, summary: Get user's groups by cursor paging, description: 'This value is used to query the groups of the user using `cursor` and `count`. The same rules apply when using standard resource paging. The example value is URL encoded because it contains characters which are reserved according to the URI Generic Syntax specification (RFC 3986). The original value before encoding is **groups[cursor=&count=100]**.'}
          id_page: {value: groups%5BstartId%3Dinitial%26count%3D100%5D, summary: Get user's groups by id paging, description: 'This value is used to query the groups of the user using `startId` and `count`. The same rules apply when using standard resource paging. The example value is URL encoded because it contains characters which are reserved according to the URI Generic Syntax specification (RFC 3986). The original value before encoding is **groups[startId=initial&count=100]**.'}
          index_page: {value: groups%5BstartIndex%3D1%26count%3D100%5D, summary: Get user's groups by index paging, description: 'This value is used to query the groups of the user using `startIndex` and `count`. The same rules apply when using standard resource paging. The example value is URL encoded because it contains characters which are reserved according to the URI Generic Syntax specification (RFC 3986). The original value before encoding is **groups[startIndex=1&count=100]**.'}
          multivalue_non_qualified: {value: emails.value, summary: Get user's emails values, description: This value is used to query only the value of the multivalue attribute emails of the user using non-qualified standard sub-attribute notation.}
          fully_qualified: {value: 'urn:ietf:params:scim:schemas:core:2.0:User:name', summary: Get full name object of the user, description: 'This value is used to query the name and its sub-attributes of the user described in schema urn:ietf:params:scim:schemas:core:2.0:User using fully qualified attribute notation.'}
          multiple_attributes: {value: 'name,emails,displayName', summary: Get a few user attributes of the user, description: 'This attributes filter is used to query the name, emails and their sub-attributes along with the displayName of the user.'}
          fully_application_user_schema: {value: 'urn:ietf:params:scim:schemas:extension:sap.application:2.0:User:applicationUsers', summary: Get all application user attributes, description: 'This value is used to query the application user and its sub-attributes of the user described in schema urn:ietf:params:scim:schemas:extension:sap.application:2.0:User.'}
      - name: excludedAttributes
        in: query
        required: false
        description: A multi-valued list that indicates attributes names in standard notation to exclude from the response, overriding the set of attributes that would be returned by default, except minimal User representation which is always returned. Attributes and excludedAttributes are mutually exclusive. Attributes are prioritized over excludedAttributes when both of them are present in the same request.
        schema: {type: string}
        examples:
          multivalue_non_qualified: {value: emails, summary: Exclude full object emails from the user, description: This value is used to query user resource without attribute emails of the user using non-qualified standard sub-attribute notation.}
          fully_qualified: {value: 'urn:ietf:params:scim:schemas:core:2.0:User:name', summary: Exclude full object name of the user, description: 'This value is used to query user resource without attribute name and its sub-attributes of the user described in schema urn:ietf:params:scim:schemas:core:2.0:User using fully qualified attribute notation.'}
          multiple_attributes: {value: 'name,emails,displayName', summary: Exclude a few user attributes of the user, description: 'This attributes filter is used to query user resource without the name, emails and their sub-attributes along with the displayName of the user.'}
      responses:
        '200':
          description: The identified user is retrieved successfully. The maximum number of returned user's groups per request is 1000. To read the rest of the user's groups, paging must be used.
          content:
            application/scim+json:
              schema: {$ref: '#/components/schemas/User'}
              examples:
                DefaultUserResponse: {$ref: '#/components/examples/DefaultUserResponse'}
                UserGroupsPageByCursor: {$ref: '#/components/examples/UserGroupsPageByCursor'}
                UserGroupsPageByIndex: {$ref: '#/components/examples/UserGroupsPageByIndex'}
                UserGroupsPageById: {$ref: '#/components/examples/UserGroupsPageById'}
                EmailsValuesAttributesUserResponse: {$ref: '#/components/examples/EmailsValuesAttributesUserResponse'}
                AddressesValuesAttributesUserResponse: {$ref: '#/components/examples/AddressesValuesAttributesUserResponse'}
                FullyQualifiedNameAttributesUserResponse: {$ref: '#/components/examples/FullyQualifiedNameAttributesUserResponse'}
                FewAttributesUserResponse: {$ref: '#/components/examples/FewAttributesUserResponse'}
                ExcludedAttributesEmailsUserResponse: {$ref: '#/components/examples/ExcludedAttributesEmailsUserResponse'}
                ExcludedAttributesNameUserResponse: {$ref: '#/components/examples/ExcludedAttributesNameUserResponse'}
                ExcludedFewAttributesUserResponse: {$ref: '#/components/examples/ExcludedFewAttributesUserResponse'}
        '400':
          description: The provided identifier is not valid.
          content:
            application/scim+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                status: 400
                schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
                detail: '"0404ac956ebf4d5889aec6e3a410fed5" is not a valid identifier!'
        '404':
          description: The user with the provided ID does not exist.
          content:
            application/scim+json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              example:
                status: 404
                schemas: ['urn:ietf:params:scim:api:messages:2.0:Error']
                detail: User <user_id> not found!
        '500': {$ref: '#/components/responses/500'}
        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '429': {$ref: '#/components/responses/429'}
