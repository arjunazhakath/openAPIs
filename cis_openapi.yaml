openapi: 3.0.0
info:
  version: 1.0.0
  title: Identity Directory API
  description: |-
    The identity directory provides a System for Cross-domain Identity Management (SCIM) 2.0 REST API for managing resources (users, groups and custom schemas). Consumers of this REST API should be familiar with System for Cross-domain Identity Management Protocol before managing their own resources. For more information, see [RFC 7643](https://tools.ietf.org/html/rfc7644).

    The identity directory service supports both basic and certificate authentication.
    * Special characters are not supported in the certificate distinguished name.
x-sap-extensible:
  supported: manual
  description: |
    #### API can be extended by adding custom fields via custom Schemas on the following entities: * User
    #### [How to add an extension field to an API](https://help.sap.com/docs/identity-authentication/identity-authentication/extensions)
x-sap-shortText: Manage users, groups and custom schemas in the cloud.
security:
- BasicAuth: []
- Certificate: []
- BearerAuth: []
servers:
- url: https://{tenant}.{host}/scim
  description: Identity Directory service endpoint
  variables:
    tenant: {description: SAP Cloud Identity tenant, default: tenant}
    host: {description: SAP Cloud Identity Services host, default: accounts.ondemand.com}
x-sap-ext-overview:
- name: Authentication Methods
  values:
  - {text: x509, format: plain}
  - {text: Basic Authentication, format: plain}
tags:
- {name: Users, description: 'Retrieve, create, modify and delete a user resource.'}
- {name: Groups, description: 'Retrieve, create, modify and delete a group resource.'}
- {name: Schemas, description: 'Retrieve, create and delete a resource''s schema.'}
- {name: Bulk, description: 'Create, modify and delete user and group resources in bulk'}
- {name: Service Provider Config, description: Retrieve service provider configuration}
- {name: Resource Types, description: Retrieve resource types}
paths:
  /Users:
    get:
      tags: [Users]
      summary: Retrieves a user resource.
      description: Retrieves a list of users. Filter and paging parameters can be combined.
      operationId: getUsers
      parameters:
      - name: filter
        in: query
        description: |
          Defines the search criteria. Supports up to 90 operands by unique attribute per request. It is not recommended to use more than 50 operands per request due to the database limitations.
          Supported operators:
          | Operator | Behavior |
          |---- | ------------- |
          | eq | The attribute and operator values must be identical for a match.|
          | ne | The attribute and operator values must not be identical for a match.|
          | sw | The attribute must start with the operator value for a match. StartsWith operator cannot be used for filtering by master data attributes and it is case-insensitive.|
          | gt | If the attribute value is greater than the operator value, there is a match. The actual comparison is dependent on the attribute type. For string attribute types, this is a lexicographical comparison, and for DateTime types, it is a chronological comparison. For integer attributes, it is a comparison by numeric value.|
          | lt | If the attribute value is less than the operator value, there is a match. The actual comparison is dependent on the attribute type. For string attribute types, this is a lexicographical comparison, and for DateTime types, it is a chronological comparison. For integer attributes, it is a comparison by numeric value.|
          | and | The filter is only a match if both expressions evaluate to true.|
          | or | The filter is a match if one of both expressions evaluate to true.|
          ### Supported User Search Attributes:
          #### Core Schema
            * id
            * externalId
            * userName
            * userType
            * name.givenName
            * name.familyName
            * emails.value
            * phoneNumbers.value
            * groups.display
            * addresses.locality
            * addresses.country
            * displayName
            * meta.lastModified

          Filtering based on an empty value is supported only for the userName attribute.  The returned list then contains users whose userName attribute equals to "" or consists of only whitespaces. Filtering based on an empty value for attributes other than userName will return 400 Bad Request. When filtering by phoneNumbers.value which contains reserved characters like "+", the filter request parameter should be URI encoded.
          #### Enterprise user resource schema
            * urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:**employeeNumber**
            * urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:**costCenter**
            * urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:**organization**
            * urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:**division**
            * urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:**department**
            * urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:**manager.value**

          All Enterprise user resource schema attributes require the schema URI urn:ietf:params:scim:schemas:extension:enterprise:2.0:User and the attribute name.
          #### SAP extension schema
            * urn:ietf:params:scim:schemas:extension:sap:2.0:User:**userUuid**
            * urn:ietf:params:scim:schemas:extension:sap:2.0:User:**userUuidHistory**
            * urn:ietf:params:scim:schemas:extension:sap:2.0:User:**validFrom**
            * urn:ietf:params:scim:schemas:extension:sap:2.0:User:**validTo**
            * urn:ietf:params:scim:schemas:extension:sap:2.0:User:**totpEnabled**
            * urn:ietf:params:scim:schemas:extension:sap:2.0:User:**webAuthEnabled**
            * urn:ietf:params:scim:schemas:extension:sap:2.0:User:**mfaEnabled**
            * urn:ietf:params:scim:schemas:extension:sap:2.0:User:**loginTime**

          All SAP extension schema attributes require the schema URI urn:ietf:params:scim:schemas:extension:sap:2.0:User and the attribute name.
          #### Application user extension schema
            * urn:ietf:params:scim:schemas:extension:sap.application:2.0:User:**applicationUsers.applicationId**
            * urn:ietf:params:scim:schemas:extension:sap.application:2.0:User:**applicationUsers.nameId**
        required: false
        schema: {type: string}
        examples:
          smith: {value: emails.value eq "john.smith@example.com" and addresses.country eq "US", summary: Search by email and country.}
          costCenter: {value: 'urn:ietf:params:scim:schemas:extension:enterprise:2.0:User:costCenter eq "1234"', summary: Search by cost center.}
          phoneNumbers: {value: phoneNumbers.value eq "%2B3 5988 691-7564", summary: Search by phoneNumbers.value.}
          userUuid: {value: 'urn:ietf:params:scim:schemas:extension:sap:2.0:User:userUuid eq "cee3b4c7-7dfd-450e-92c8-b12c7701aa66"', summary: Search by userUuid.}
          applicationId: {value: 'urn:ietf:params:scim:schemas:extension:sap.application:2.0:User:applicationUsers.applicationId eq "cfe5b4c8-7dfd-450e-12c8-b12c7706aa66"', summary: Search by applicationId.}
          nameId: {value: 'urn:ietf:params:scim:schemas:extension:sap.application:2.0:User:applicationUsers.nameId eq "exampleNameId"', summary: Search by nameId.}
      - name: startId
        in: query
        description: |
          Used for Id-Based pagination (recommended). Page through users by specifying `startId` parameter.
          Possible values:
          | Value | Description |
          |------------ | ------------- |
          | `initial`| If initial value is specified, the initial user is returned as the first entry of the query result. |
          | `user ID` | If `<user id>` value is specified, the user with this user ID is returned as the first entry of the query result.|
        required: false
        schema: {type: string}
        examples:
          initial: {value: emails.value eq "john.smith@example.com"&startId=initial, summary: Search by email using initial id.}
          Id: {value: startId=30291f26-1a74-4e61-bf27-ed29f579d45d&count=5, summary: Search by user id.}
      - name: cursor
        in: query
        description: |
          Used for Cursor-Based pagination. Page through users by specifying `cursor` parameter.
          Possible values:
          | Value | Description |
          |------------ | ------------- |
          | ``| If an empty value is specified, the initial user is returned as the first entry of the query result. |
          | `nextCursor` | If `<nextCursor>` value is specified, the next page with users is returned and the first entry of the query result corresponds to the cursor value.|
        required: false
        schema: {type: string}
        examples:
          emptyCursor: {value: emails.value eq "john.smith@example.com"&cursor, summary: Search by email using empty cursor.}
          Cursor: {value: cursor=MzAyOTFmMjYtMWE3NC00ZTYxLWJmMjctZWQyOWY1NzlkNDVk&count=5, summary: Search by specifying the cursor.}
      - name: count
        in: query
        description: Represents the number of items which will be returned per page. A negative value is interpreted as 0, which means that no results should be returned. Maximum value is 100. Anything above 100 will return only 100 results per page.
        required: false
        schema: {type: integer, minimum: 0, maximum: 100, default: 100}
      - name: attributes
        in: query
        required: false
        description: A multi-valued list that indicates attributes names in standard notation to return in the response, overriding the set of attributes that would be returned by default, except minimal User representation which is always returned. When attribute 'groups' is part of the attributes, then id, index or cursor paging shall be used in the query. Attributes and excludedAttributes are mutually exclusive. Attributes are prioritized over excludedAttributes when both of them are present in the same request.
        schema: {type: string}
        examples:
          cursor_page: {value: groups%5Bcursor%3D%26count%3D100%5D, summary: Get user's groups by cursor paging, description: 'This value is used to query the groups of the user using `cursor` and `count`. The same rules apply when using standard resource paging. The example value is URL encoded because it contains characters which are reserved according to the URI Generic Syntax specification (RFC 3986). The original value before encoding is **groups[cursor=&count=100]**.'}
          id_page: {value: groups%5BstartId%3Dinitial%26count%3D100%5D, summary: Get user's groups by id paging, description: 'This value is used to query the groups of the user using `startId` and `count`. The same rules apply when using standard resource paging. The example value is URL encoded because it contains characters which are reserved according to the URI Generic Syntax specification (RFC 3986). The original value before encoding is **groups[startId=initial&count=100]**.'}
          index_page: {value: groups%5BstartIndex%3D1%26count%3D100%5D, summary: Get user's groups by index paging, description: 'This value is used to query the groups of the user using `startIndex` and `count`. The same rules apply when using standard resource paging. The example value is URL encoded because it contains characters which are reserved according to the URI Generic Syntax specification (RFC 3986). The original value before encoding is **groups[startIndex=1&count=100]**.'}
          multivalue_non_qualified: {value: emails.value, summary: Get user's emails values, description: This value is used to query only the value of the multivalue attribute emails of the user using non-qualified standard sub-attribute notation.}
          fully_qualified: {value: 'urn:ietf:params:scim:schemas:core:2.0:User:name', summary: Get full name object of the user, description: 'This value is used to query the name and its sub-attributes of the user described in schema urn:ietf:params:scim:schemas:core:2.0:User using fully qualified attribute notation.'}
          multiple_attributes: {value: 'name,emails,displayName', summary: Get a few user attributes of the user, description: 'This attributes filter is used to query the name, emails and their sub-attributes along with the displayName of the user.'}
      - name: excludedAttributes
        in: query
        required: false
        description: A multi-valued list that indicates attributes names in standard notation to exclude from the response, overriding the set of attributes that would be returned by default, except minimal User representation which is always returned. Attributes and excludedAttributes are mutually exclusive. Attributes are prioritized over excludedAttributes when both of them are present in the same request.
        schema: {type: string}
        examples:
          multivalue_non_qualified: {value: emails, summary: Exclude full object emails from the user, description: This value is used to query user resource without attribute emails of the user using non-qualified standard sub-attribute notation.}
          fully_qualified: {value: 'urn:ietf:params:scim:schemas:core:2.0:User:name', summary: Exclude full object name of the user, description: 'This value is used to query user resource without attribute name and its sub-attributes of the user described in schema urn:ietf:params:scim:schemas:core:2.0:User using fully qualified attribute notation.'}
          multiple_attributes: {value: 'name,emails,displayName', summary: Exclude a few user attributes of the user, description: 'This attributes filter is used to query user resource without the name, emails and their sub-attributes along with the displayName of the user.'}
      responses:
        '200':
          description: The user resource is retrieved successfully. The maximum number of returned user's groups per request is 1000.
          content:
            application/scim+json:
              schema:
                type: object
                title: SearchResultUsers
                allOf:
                - {$ref: '#/components/schemas/SearchResult'}
                - type: object
                  properties:
                    Resources:
                      type: array
                      items: {$ref: '#/components/schemas/User'}
              examples:
                searchById:
                  description: |
                    The following paging attributes are returned in the response:
                    | Value | Description |
                    |------------ | ------------- |
                    | totalResults | Specifies the total number of results matching the query, for example: 100. |
                    | itemsPerPage | Specifies the maximum number of query results returned in a query response page, for example: 3.|
                    | startId | Specifies the first entry of the query result, for example: initial or `<user id>`.|
                    | nextId | Specifies the next user id (that is, the id of the first user on the next page). For example: `<user id>` or `<end>`. The `<end>` value indicates that the last user of the total number of users matching the query is returned. |
