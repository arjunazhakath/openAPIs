        '401': {$ref: '#/components/responses/401'}
        '403': {$ref: '#/components/responses/403'}
        '429': {$ref: '#/components/responses/429'}
    post:
      tags: [Schemas]
      summary: Creates a custom schema.
      description: |
        When creating a schema, `id`, `name`, `attributes` and `schemas` attributes are required.
        You can create up to 20 custom schemas, each of it containing a maximum number of 20 custom attributes
        based on the supported data types.
        The ID of the custom schema should not exceed 20 characters (alphanumeric and underscore)
        and the name of the custom attributes should not exceed 30 characters (alphanumeric and underscore)
        without counting the prefix of the custom schema.
      operationId: createSchema
      requestBody:
        content:
          application/scim+json:
            schema: {$ref: '#/components/schemas/Schema'}
            example:
              id: urn:sap:cloud:scim:schemas:extension:custom:2.0:CustomSchema
              schemas: ['urn:ietf:params:scim:schemas:core:2.0:Schema']
              name: CustomSchema
              description: Custom schema description
